<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Laboratórios e Quadra</title>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #4c8c4a;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333;
      --danger: #d32f2f;
      --success: #2e7d32;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .controls {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, button, input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-light);
    }

    button.btn-export {
      background-color: #0277bd;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .schedule-table th, .schedule-table td {
      border: 1px solid #e0e0e0;
      padding: 12px;
      text-align: center;
    }

    .schedule-table th {
      background-color: #f0f0f0;
      font-weight: bold;
    }

    .slot {
      cursor: pointer;
      transition: background 0.2s;
    }

    .slot.free {
      background-color: #e8f5e9;
      color: var(--success);
      font-weight: bold;
    }

    .slot.free:hover {
      background-color: #c8e6c9;
    }

    .slot.occupied {
      background-color: #ffebee;
      color: var(--danger);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      margin-bottom: 15px;
    }

    .modal-content form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-cancel {
      background-color: #757575;
    }

    .btn-danger {
      background-color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Reserva de Laboratórios e Quadra</h1>
      <p>Gerencie e evite conflitos de horários no campus</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <label for="spaceSelect"><strong>Espaço:</strong></label>
        <select id="spaceSelect" onchange="renderSchedule()">
          <option value="Lab 01">Laboratório de Informática 01</option>
          <option value="Lab 02">Laboratório de Informática 02</option>
          <option value="Lab 03">Laboratório de Informática 03</option>
          <option value="Lab Maker">Laboratório Maker</option>
          <option value="Lab de Geologia">Laboratório de Geologia</option>
          <option value="Quadra">Quadra Poliesportiva</option>
        </select>
      </div>

      <div class="control-group">
        <button class="btn-export" onclick="exportSchedule()">📥 Exportar Grade (JSON)</button>
        <button class="btn-danger" onclick="clearAllReservations()">🗑️ Limpar Reservas</button>
      </div>
    </div>

    <table class="schedule-table">
      <thead>
        <tr>
          <th>Horário</th>
          <th>Segunda</th>
          <th>Terça</th>
          <th>Quarta</th>
          <th>Quinta</th>
          <th>Sexta</th>
        </tr>
      </thead>
      <tbody id="scheduleBody">
        <!-- Conteúdo preenchido dinamicamente pelo JS -->
      </tbody>
    </table>
  </div>
  <p></p>

  <!-- Modal de Reserva / Cancelamento -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Reservar Horário</h3>
      <form id="reserveForm" onsubmit="handleFormSubmit(event)">
        
        <div id="formFields">
          <label for="respName">Responsável / Disciplina:</label>
          <input type="text" id="respName" placeholder="Ex: Prof. Silva (Algoritmos)" required>
        </div>

        <div class="modal-buttons">
          <button type="button" class="btn-cancel" onclick="closeModal()">Sair</button>
          <button type="submit" id="btnSubmit">Salvar Reserva</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const days = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
    const timeSlots = ['07:00 8:00','08:00 - 9:00', '9:00 - 10:00', '10:00 - 11:00', '12:00 - 13:00', '13:00 - 14:00', '15:00 - 16:00', '16:00 - 17:00', '17:00 - 18:00', '18:00 - 19:00', '19:00 - 20:00', '20:00 - 21:00', '21:00 - 22:00'];

    // Carregar reservas salvas no localStorage ou iniciar vazio
    let reservations = JSON.parse(localStorage.getItem('campus_reservations')) || {};

    function saveToLocalStorage() {
      localStorage.setItem('campus_reservations', JSON.stringify(reservations));
    }

    function renderSchedule() {
      const selectedSpace = document.getElementById('spaceSelect').value;
      const tbody = document.getElementById('scheduleBody');
      tbody.innerHTML = '';

      timeSlots.forEach(time => {
        const row = document.createElement('tr');
        
        const timeTh = document.createElement('th');
        timeTh.textContent = time;
        row.appendChild(timeTh);

        days.forEach(day => {
          const td = document.createElement('td');
          const key = `${selectedSpace}_${day}_${time}`;
          const reservation = reservations[key];

          td.classList.add('slot');
          if (reservation) {
            td.classList.add('occupied');
            td.innerHTML = `<strong>Ocupado</strong><br><small>${reservation.responsible}</small>`;
            td.onclick = () => openCancelModal(key, day, time, reservation.responsible);
          } else {
            td.classList.add('free');
            td.textContent = 'Livre';
            td.onclick = () => openReserveModal(key, day, time);
          }

          row.appendChild(td);
        });

        tbody.appendChild(row);
      });
    }

    let currentKey = '';

    function openReserveModal(key, day, time) {
      currentKey = key;
      document.getElementById('modalTitle').textContent = `Reservar (${day} - ${time})`;
      document.getElementById('formFields').style.display = 'block';
      document.getElementById('respName').value = '';
      document.getElementById('respName').required = true;
      document.getElementById('btnSubmit').textContent = 'Reservar';
      document.getElementById('btnSubmit').className = '';
      document.getElementById('modal').style.display = 'flex';
    }

    function openCancelModal(key, day, time, responsible) {
      currentKey = key;
      document.getElementById('modalTitle').textContent = `Cancelar Reserva (${day} - ${time})`;
      document.getElementById('formFields').style.display = 'block';
      document.getElementById('respName').value = responsible;
      document.getElementById('respName').required = false;
      document.getElementById('btnSubmit').textContent = 'Confirmar Cancelamento';
      document.getElementById('btnSubmit').className = 'btn-danger';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const responsibleInput = document.getElementById('respName').value.trim();

      if (reservations[currentKey]) {
        delete reservations[currentKey];
      } else if (responsibleInput) {
        reservations[currentKey] = {
          responsible: responsibleInput,
          createdAt: new Date().toISOString()
        };
      }

      saveToLocalStorage();
      closeModal();
      renderSchedule();
    }

    function exportSchedule() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reservations, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "reservas_campus.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function clearAllReservations() {
      if (confirm('Deseja realmente apagar todas as reservas salvas?')) {
        reservations = {};
        saveToLocalStorage();
        renderSchedule();
      }
    }

    renderSchedule();
  </script>
</body>
</html>
